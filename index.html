<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro ETT & Externos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
  <style>
    .loader { border: 3px solid #f3f3f3; border-top: 3px solid #3b82f6; border-radius: 50%; width: 18px; height: 18px; animation: spin 1s linear infinite; display: inline-block; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .tab-active { border-bottom: 2px solid #3b82f6; color: #1d4ed8; font-weight: 600; }
    .tab-inactive { border-bottom: 2px solid transparent; color: #6b7280; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col font-sans text-gray-800">

  <!-- LOGIN -->
  <div id="loginView" class="flex-1 flex items-center justify-center">
    <form id="loginForm" class="bg-white p-8 rounded-xl shadow-lg w-full max-w-sm space-y-4">
      <h2 class="text-xl font-bold text-center mb-2">Acceso Registro</h2>
      <input type="email" id="email" placeholder="Email" required class="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500 outline-none">
      <input type="password" id="password" placeholder="Contraseña" required class="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500 outline-none">
      <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 transition">Entrar</button>
      <p id="loginError" class="text-red-500 text-sm hidden text-center"></p>
    </form>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboardView" class="hidden flex-1 flex flex-col p-4 md:p-8 max-w-6xl mx-auto w-full">
    <header class="flex justify-between items-center mb-4">
      <h1 class="text-2xl font-bold text-gray-900">📋 Registro Diario</h1>
      <button id="logoutBtn" class="text-sm text-gray-500 hover:text-red-600">Cerrar sesión</button>
    </header>

    <!-- TABS -->
    <div class="flex gap-4 mb-4 border-b">
      <button id="tab-todos" class="pb-2 px-2 tab-active" onclick="setFilter('todos')">Todos</button>
      <button id="tab-ETT" class="pb-2 px-2 tab-inactive" onclick="setFilter('ETT')">ETT</button>
      <button id="tab-Externos" class="pb-2 px-2 tab-inactive" onclick="setFilter('Externos')">Externos</button>
    </div>

    <!-- FORM -->
    <div class="bg-white p-5 rounded-xl shadow-sm mb-6 grid grid-cols-1 md:grid-cols-6 gap-3">
      <input id="dni" placeholder="DNI (12345678A)" class="p-2 border rounded uppercase focus:ring-2 focus:ring-blue-500 outline-none">
      <input id="nombre" placeholder="Nombre" class="p-2 border rounded focus:ring-2 focus:ring-blue-500 outline-none md:col-span-2">
      <select id="tipo" class="p-2 border rounded focus:ring-2 focus:ring-blue-500 outline-none">
        <option value="ETT">ETT</option>
        <option value="Externos">Externos</option>
      </select>
      <input id="depto" placeholder="Departamento" class="p-2 border rounded focus:ring-2 focus:ring-blue-500 outline-none">
      <input id="obs" placeholder="Observaciones" class="p-2 border rounded focus:ring-2 focus:ring-blue-500 outline-none">
      <div class="md:col-span-6 flex gap-2 mt-1">
        <button id="btnEntrada" class="flex-1 bg-green-600 text-white py-2 rounded hover:bg-green-700 transition font-medium">🟢 Entrada</button>
        <button id="btnSalida" class="flex-1 bg-orange-500 text-white py-2 rounded hover:bg-orange-600 transition font-medium">🟠 Salida</button>
        <button id="btnImport" class="px-4 bg-gray-200 text-gray-700 rounded hover:bg-gray-300 transition">📥 Importar CSV</button>
      </div>
      <p id="formMsg" class="text-sm mt-1 md:col-span-6 hidden"></p>
    </div>

    <!-- TABLE -->
    <div class="bg-white rounded-xl shadow-sm overflow-hidden flex-1">
      <div class="overflow-x-auto">
        <table class="w-full text-sm text-left">
          <thead class="bg-gray-100 text-gray-600 uppercase">
            <tr>
              <th class="p-3">Tipo</th>
              <th class="p-3">Nombre</th>
              <th class="p-3">DNI</th>
              <th class="p-3">Entrada</th>
              <th class="p-3">Salida</th>
              <th class="p-3">Total</th>
              <th class="p-3">Depto.</th>
              <th class="p-3">Obs.</th>
            </tr>
          </thead>
          <tbody id="tableBody" class="divide-y divide-gray-200">
            <tr><td colspan="8" class="p-4 text-center text-gray-400">Cargando...</td></tr>
          </tbody>
        </table>
      </div>
      <div class="p-4 border-t flex justify-end">
        <button id="btnExport" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition">📥 Exportar Excel</button>
      </div>
    </div>
  </div>

  <!-- IMPORT MODAL -->
  <div id="importModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
    <div class="bg-white p-6 rounded-xl shadow-lg w-full max-w-md">
      <h3 class="text-lg font-bold mb-3">📥 Importar Listado</h3>
      <p class="text-sm text-gray-600 mb-4">CSV con columnas: DNI, Nombre, Tipo, Departamento</p>
      <input type="file" id="csvFile" accept=".csv,.xlsx,.xls" class="block w-full text-sm mb-4">
      <div class="flex justify-end gap-2">
        <button onclick="document.getElementById('importModal').classList.add('hidden')" class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded">Cancelar</button>
        <button id="btnProcessImport" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Procesar</button>
      </div>
      <p id="importStatus" class="text-sm mt-2 text-center hidden"></p>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, collection, addDoc, updateDoc, doc, query, where, onSnapshot, serverTimestamp, getDocs, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // ⚠️ REEMPLAZA ESTO CON TU CONFIG DE FIREBASE
    const firebaseConfig = {
      apiKey: "AIzaSyAVT8XCk0Ji-sgENTImSsmGE1UO2i7vBkA",
      authDomain: "regwork-19628.firebaseapp.com",
      projectId: "regwork-19628",
      storageBucket: "regwork-19628.firebasestorage.app",
      messagingSenderId: "431109000889",
      appId: "1:431109000889:web:d1072b49b0b1d795255568"
    };

    // Inicializar Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    
    // Variables globales
    let currentUser = null;
    let todayRecords = [];
    let currentFilter = 'todos';

    // Funciones helper
    function fmtDate(ts) {
      if (!ts) return '-';
      return new Date(ts.seconds * 1000).toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit'});
    }

    function calcDuration(start, end) {
      if (!end || !start) return '-';
      const ms = end.seconds * 1000 - start.seconds * 1000;
      const h = Math.floor(ms / 3600000);
      const m = Math.floor((ms % 3600000) / 60000);
      return h + 'h ' + m + 'm';
    }

    function getTodayStr() {
      return new Date().toISOString().split('T')[0];
    }

    function showMessage(text, type) {
      const el = document.getElementById('formMsg');
      el.textContent = text;
      el.className = 'text-sm mt-1 md:col-span-6 ' + (type === 'error' ? 'text-red-500' : 'text-green-600');
      el.classList.remove('hidden');
      setTimeout(() => el.classList.add('hidden'), 3000);
    }

    // Auth state observer
    onAuthStateChanged(auth, (user) => {
      console.log('Auth state:', user ? 'Logged in' : 'Logged out');
      if (user) {
        currentUser = user;
        document.getElementById('loginView').classList.add('hidden');
        document.getElementById('dashboardView').classList.remove('hidden');
        loadToday();
      } else {
        currentUser = null;
        document.getElementById('loginView').classList.remove('hidden');
        document.getElementById('dashboardView').classList.add('hidden');
      }
    });

    // Login form
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const pass = document.getElementById('password').value;
      const errorEl = document.getElementById('loginError');
      
      try {
        await signInWithEmailAndPassword(auth, email, pass);
        errorEl.classList.add('hidden');
      } catch (error) {
        console.error('Login error:', error.code, error.message);
        let msg = 'Error al entrar';
        if (error.code === 'auth/user-not-found') msg = 'Usuario no registrado';
        else if (error.code === 'auth/wrong-password') msg = 'Contraseña incorrecta';
        else if (error.code === 'auth/invalid-credential') msg = 'Credenciales inválidas';
        else if (error.code === 'auth/network-request-failed') msg = 'Sin conexión';
        errorEl.textContent = msg;
        errorEl.classList.remove('hidden');
      }
    });

    // Logout
    document.getElementById('logoutBtn').addEventListener('click', () => {
      signOut(auth);
    });

    // Cargar registros de hoy
    function loadToday() {
      const q = query(
        collection(db, 'registros'), 
        where('uid', '==', currentUser.uid), 
        where('fecha', '==', getTodayStr())
      );
      
      onSnapshot(q, (snapshot) => {
        todayRecords = [];
        snapshot.forEach((doc) => {
          todayRecords.push({ id: doc.id, ...doc.data() });
        });
        todayRecords.sort((a, b) => (b.entrada?.seconds || 0) - (a.entrada?.seconds || 0));
        renderTable();
      }, (error) => {
        console.error('Error loading records:', error);
      });
    }

    // Renderizar tabla
    function renderTable() {
      const tbody = document.getElementById('tableBody');
      const filtered = currentFilter === 'todos' 
        ? todayRecords 
        : todayRecords.filter(r => r.tipo === currentFilter);
      
      if (filtered.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" class="p-4 text-center text-gray-400">Sin registros hoy</td></tr>';
        return;
      }
      
      tbody.innerHTML = filtered.map(r => {
        const tipoClass = r.tipo === 'ETT' ? 'bg-purple-100 text-purple-800' : 'bg-blue-100 text-blue-800';
        const rowClass = !r.salida ? 'bg-green-50' : '';
        
        return `<tr class="hover:bg-gray-50 ${rowClass}">
          <td class="p-3"><span class="px-2 py-1 text-xs rounded-full ${tipoClass}">${r.tipo}</span></td>
          <td class="p-3 font-medium">${r.nombre || '-'}</td>
          <td class="p-3 font-mono text-xs">${r.dni}</td>
          <td class="p-3">${fmtDate(r.entrada)}</td>
          <td class="p-3">${fmtDate(r.salida)}</td>
          <td class="p-3 font-semibold text-blue-700">${calcDuration(r.entrada, r.salida)}</td>
          <td class="p-3">${r.depto || '-'}</td>
          <td class="p-3 max-w-xs truncate">${r.observaciones || '-'}</td>
        </tr>`;
      }).join('');
    }

    // Función global para filtros
    window.setFilter = function(filter) {
      currentFilter = filter;
      // Actualizar tabs
      ['todos', 'ETT', 'Externos'].forEach(f => {
        const btn = document.getElementById('tab-' + f);
        if (f === filter) {
          btn.classList.remove('tab-inactive');
          btn.classList.add('tab-active');
        } else {
          btn.classList.remove('tab-active');
          btn.classList.add('tab-inactive');
        }
      });
      renderTable();
    };

    // Autocompletar desde empleados
    document.getElementById('dni').addEventListener('blur', async (e) => {
      const dni = e.target.value.trim().toUpperCase();
      if (!/^[0-9]{8}[A-Z]$/.test(dni)) return;
      
      try {
        const q = query(collection(db, 'empleados'), where('dni', '==', dni));
        const snap = await getDocs(q);
        if (!snap.empty) {
          const emp = snap.docs[0].data();
          document.getElementById('nombre').value = emp.nombre || '';
          document.getElementById('tipo').value = emp.tipo || 'ETT';
          document.getElementById('depto').value = emp.depto || '';
          showMessage('Datos auto-completados');
        }
      } catch (err) {
        console.warn('No se pudo autocompletar:', err);
      }
    });

    // Botón Entrada
    document.getElementById('btnEntrada').addEventListener('click', async () => {
      const dni = document.getElementById('dni').value.trim().toUpperCase();
      if (!/^[0-9]{8}[A-Z]$/.test(dni)) {
        showMessage('DNI no válido (ej: 12345678A)', 'error');
        return;
      }
      
      try {
        await addDoc(collection(db, 'registros'), {
          uid: currentUser.uid,
          tipo: document.getElementById('tipo').value,
          dni: dni,
          nombre: document.getElementById('nombre').value.trim(),
          depto: document.getElementById('depto').value.trim(),
          observaciones: document.getElementById('obs').value.trim(),
          fecha: getTodayStr(),
          entrada: serverTimestamp(),
          estado: 'activo'
        });
        showMessage('✅ Entrada registrada');
        ['dni', 'nombre', 'depto', 'obs'].forEach(id => document.getElementById(id).value = '');
      } catch (error) {
        console.error(error);
        showMessage('Error al guardar', 'error');
      }
    });

    // Botón Salida
    document.getElementById('btnSalida').addEventListener('click', async () => {
      const dni = document.getElementById('dni').value.trim().toUpperCase();
      const active = todayRecords.find(r => r.dni === dni && !r.salida);
      
      if (!active) {
        showMessage('No hay entrada activa para ese DNI', 'error');
        return;
      }
      
      try {
        await updateDoc(doc(db, 'registros', active.id), {
          salida: serverTimestamp(),
          estado: 'finalizado'
        });
        showMessage('✅ Salida registrada');
        document.getElementById('dni').value = '';
      } catch (error) {
        console.error(error);
        showMessage('Error al actualizar', 'error');
      }
    });

    // Exportar Excel
    document.getElementById('btnExport').addEventListener('click', () => {
      const filtered = currentFilter === 'todos' 
        ? todayRecords 
        : todayRecords.filter(r => r.tipo === currentFilter);
      
      const data = filtered.map(r => ({
        "Tipo": r.tipo,
        "Nombre del empleado": r.nombre || '',
        "DNI": r.dni,
        "Fecha de Registro": r.fecha,
        "Hora de Entrada": fmtDate(r.entrada),
        "Hora de Salida": fmtDate(r.salida),
        "Total de horas trabajadas": calcDuration(r.entrada, r.salida),
        "Observaciones": r.observaciones || '',
        "Departamento": r.depto || ''
      }));
      
      const ws = XLSX.utils.json_to_sheet(data);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Registro_' + getTodayStr());
      XLSX.writeFile(wb, 'Registro_' + currentFilter + '_' + getTodayStr() + '.xlsx');
    });

    // Importar CSV
    document.getElementById('btnImport').addEventListener('click', () => {
      document.getElementById('importModal').classList.remove('hidden');
    });

    document.getElementById('btnProcessImport').addEventListener('click', async () => {
      const file = document.getElementById('csvFile').files[0];
      if (!file) {
        alert('Selecciona un archivo');
        return;
      }
      
      const status = document.getElementById('importStatus');
      status.classList.remove('hidden');
      status.textContent = 'Leyendo archivo...';

      const reader = new FileReader();
      reader.onload = async (e) => {
        try {
          const wb = XLSX.read(e.target.result, {type: 'binary'});
          const ws = wb.Sheets[wb.SheetNames[0]];
          const data = XLSX.utils.sheet_to_json(ws);
          
          if (!data.length || !data[0].DNI) {
            throw new Error('Formato incorrecto. Necesita columna DNI');
          }
          
          status.textContent = 'Procesando ' + data.length + ' registros...';
          let batch = writeBatch(db);
          let count = 0;
          
          data.forEach((row, index) => {
            const ref = doc(db, 'empleados', row.DNI.toString().replace(/\s/g, ''));
            batch.set(ref, {
              dni: row.DNI,
              nombre: row.Nombre || '',
              tipo: row.Tipo || 'ETT',
              depto: row.Departamento || ''
            });
            count++;
            
            if (count % 450 === 0) {
              batch.commit();
              batch = writeBatch(db);
            }
          });
          
          if (count % 450 !== 0) {
            await batch.commit();
          }
          
          status.textContent = '✅ ' + count + ' empleados importados';
          setTimeout(() => {
            document.getElementById('importModal').classList.add('hidden');
          }, 2000);
        } catch (err) {
          console.error(err);
          status.textContent = '❌ Error: ' + err.message;
          status.classList.add('text-red-600');
        }
      };
      reader.readAsBinaryString(file);
    });
  </script>
</body>
</html>
